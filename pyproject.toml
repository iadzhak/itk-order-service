[project]
name = "itk-order-service"
version = "0.1.0"
description = "Order Service with integrated Capashino services (Catalog, Payments, Shipping, Notifications)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
exclude = ["alembic/"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ['app/*']
