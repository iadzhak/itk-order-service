[project]
name = "itk-order-service"
version = "0.1.0"
description = "Order Service with integrated Capashino services (Catalog, Payments, Shipping, Notifications)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
exclude = ["alembic/"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ['app/*']


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-vv"]
